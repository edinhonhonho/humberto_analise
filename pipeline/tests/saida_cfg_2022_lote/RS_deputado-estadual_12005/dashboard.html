14c-.56.37-1.15.7-1.79.92c-1.66.58-3.46.62-5.13.1c-1.03-.3-1.97-.83-2.78-1.51l-3.19 3.19c-.56.59-1.53.59-2.12 0c-.58-.56-.58-1.56 0-2.12l3.38-3.38l2.65-.52a6.1 6.1 0 0 0 2.81 1.96c1.16.35 2.44.34 3.59-.04c.29-.09.57-.2.83-.34L7.6 9l-1.77 1.78L3 7.95L7.95 3l4.24 1.41L9 7.6l8.31 8.29c.19-.18.34-.36.49-.56c1.5-1.97 1.62-4.91.29-7.33C16.78 5.57 14.5 3.55 12 2c1.41.5 2.76 1.17 4 2.04s2.43 1.89 3.33 3.21c.9 1.29 1.54 2.87 1.67 4.54c.1 1.68-.34 3.44-1.3 4.86c-.2.35-.46.63-.7.91z\"/><\/svg><\/div><p class=\"eyebrow\">Deputado Estadual · RS · 2022 · 1º turno · nº 12005<\/p><h1>Candidato 12005<\/h1><p class=\"sub\">Análise espacial da votação por município e nas principais cidades.<\/p><\/header><div class=\"kpis\"><div class=\"kpi hero\"><b>16.838<\/b><span>votos nominais<\/span><small>2,01% dos votos válidos do estado<\/small><\/div><div class=\"kpi\"><b>144 de 144<\/b><span>municípios com voto<\/span><small>em 0 municípios não teve nenhum voto<\/small><\/div><div class=\"kpi\"><b>22<\/b><span>município(s) para 50% dos votos<\/span><small>67 para 80%<\/small><\/div><div class=\"kpi\"><b>0,52<\/b><span>concentração (Gini)<\/span><small>0 = espalhado · 1 = concentrado<\/small><\/div><div class=\"kpi\"><b>0,00<\/b><span>vizinhança (Moran)<\/span><small>−1 a 1 · 0 = sem padrão · p = 0,330<\/small><\/div><\/div>\n<details class=\"guide\" id=\"guia\"><summary>Como ler este relatório: o que significam os números e mapas<\/summary>\n<dl>\n<dt>% dos votos válidos<\/dt><dd><p>De cada 100 votos válidos dados no município (sem brancos e nulos), quantos foram para o\ncandidato. É o melhor jeito de comparar cidades grandes e pequenas.<\/p><\/dd>\n<dt>Quociente locacional<\/dt><dd><p>A % do candidato no município dividida pela % dele no estado inteiro.\n<em>1<\/em> = igual à média; <em>3<\/em> = o município vota nele três vezes mais que a média; <em>0,5<\/em> = metade.\nServe para achar onde ele é proporcionalmente forte, mesmo em cidade pequena.<\/p><\/dd>\n<dt>Gini (concentração)<\/dt><dd><p>Mede quanto os votos estão concentrados em poucos municípios. Vai de <em>0<\/em> a <em>1<\/em>.\nPerto de 0, os votos estão espalhados de forma parecida por todo o estado. Perto de 1, quase tudo vem de pouquíssimos\nmunicípios. Ele não desconta o tamanho da cidade: uma capital grande já tem mais votos só por ter mais eleitores.\nPor isso vale olhar junto o gráfico de concentração (seção 2).<\/p><\/dd>\n<dt>Moran global (vizinhança)<\/dt><dd><p>Responde a uma pergunta só: <em>municípios vizinhos tendem a ter votação parecida?<\/em>\nVai de <em>−1<\/em> a <em>+1<\/em>. Perto de 0, não há padrão geográfico. Positivo, a votação forma manchas no mapa\n(vizinhos fortes juntos, vizinhos fracos juntos). Negativo, os vizinhos tendem a ser opostos, como um tabuleiro de xadrez.\nO <em>p<\/em> diz se o resultado pode ser acaso: abaixo de 0,05, é improvável que seja.<\/p><\/dd>\n<dt>Eficiência e potencial<\/dt><dd><p><em>Votos por 100 aptos<\/em> mostra quanto do eleitorado o candidato converteu em voto em cada município.\n<em>Votos até a média<\/em> é quantos votos a mais o município daria se votasse nele como o estado inteiro. É um indicador para priorizar,\nnão uma projeção.<\/p><\/dd>\n<dt>Abrangência<\/dt><dd><p>Em quantos municípios o candidato teve presença relevante (1% ou mais dos votos válidos). Serve para comparar\nalcance geográfico entre candidatos, separado do total de votos.<\/p><\/dd>\n<dt>LISA (clusters)<\/dt><dd><p>É o Moran feito município por município. Para cada um, compara a sua votação com a média dos\nvizinhos que fazem divisa. Só colore o que for estatisticamente significativo:\n<em>Alto-Alto<\/em> (vermelho) = forte e cercado de vizinhos fortes, ou seja, um <b>núcleo de força<\/b>;\n<em>Baixo-Baixo<\/em> (azul) = fraco e cercado de vizinhos fracos, ou seja, um vazio;\n<em>Outlier<\/em> (dourado) = contraste: forte em meio a fracos é uma <b>ilha de voto<\/b>; fraco em meio a fortes é uma lacuna, a oportunidade mais barata. A seção 3 explica cada um;\ncinza = sem padrão claro. Quando o candidato tem poucos votos, o Baixo-Baixo costuma ser só &quot;não teve voto&quot;;\no mais útil costuma ser o Alto-Alto e os outliers.<\/p><\/dd>\n<\/dl><\/details>\n<section class=\"toc\" id=\"sumario\"><h3>Sumário<\/h3><div class=\"tocg\"><div><h4><b>A<\/b>Panorama e concentração<\/h4><a href=\"#panorama\"><i>1<\/i>Panorama estadual<\/a><a href=\"#concentracao\"><i>2<\/i>Concentração<\/a><a href=\"#vizinhanca\"><i>3<\/i>Autocorrelação espacial: vizinhança<\/a><a href=\"#cidades\"><i>4<\/i>Cidades<\/a><\/div><div><h4><b>B<\/b>Comparação com outros candidatos<\/h4><a href=\"#comparacao\"><i>5<\/i>Comparação com os mais votados de cada partido<\/a><a href=\"#sobreposicao\"><i>6<\/i>Sobreposição com outros candidatos<\/a><a href=\"#federacao\"><i>7<\/i>Participação na federação<\/a><\/div><div><h4><b>C<\/b>Modelagem e prioridades<\/h4><a href=\"#modelo\"><i>8<\/i>Modelo: acima e abaixo do esperado<\/a><a href=\"#distancia\"><i>9<\/i>Distância dos redutos<\/a><a href=\"#potencial\"><i>10<\/i>Eficiência e potencial<\/a><\/div><div><h4><b>D<\/b>Contexto e método<\/h4><a href=\"#contexto\"><i>11<\/i>Contexto: partido, abstenção, brancos e nulos<\/a><a href=\"#metodo\"><i>M<\/i>Notas metodológicas<\/a><\/div><\/div><\/section><div class=\"parte\"><span>Parte A<\/span><b>Panorama e concentração<\/b><\/div><h2 id=\"panorama\"><span class=\"n\">1<\/span>Panorama estadual<\/h2><p class=\"lead\">Passe o mouse em um município para ver os números e <b>clique nele para abrir um card com os detalhes<\/b>. Os três botões trocam o que o mapa mostra: volume de votos, força proporcional e onde ele é mais forte que a média do estado.<\/p><div class=\"card\"><div class=\"msearch\"><input type=\"search\" id=\"msq\" placeholder=\"Buscar município pelo nome\" autocomplete=\"off\" role=\"combobox\" aria-expanded=\"false\" aria-controls=\"msl\" aria-label=\"Buscar município pelo nome\"><ul id=\"msl\" role=\"listbox\" hidden><\/ul><\/div><p class=\"mhint s; 1 = todos em um só) e inclui os municípios sem voto. O <b>número efetivo<\/b> de municípios é 1/Σs², em que s é a fração dos votos do candidato em cada município (Laakso e Taagepera propuseram a medida para partidos; aqui ela é aplicada a municípios).<\/p><span class=\"rl\">Referências<\/span><ul class=\"refs\"><li>Gini, C. (1912). <i>Variabilità e mutabilità<\/i>. Bologna: Tipografia di Paolo Cuppini.<\/li><li>Laakso, M., &amp; Taagepera, R. (1979). “Effective” number of parties: a measure with application to West Europe. <i>Comparative Political Studies<\/i>, 12(1), 3–27.<\/li><\/ul><\/aside><h2 id=\"vizinhanca\"><span class=\"n\">3<\/span>Autocorrelação espacial: vizinhança<\/h2><p class=\"lead\">O índice de Moran da % de votos válidos é <b>0,002<\/b> (p = 0,330): a vizinhança importa de forma <b>praticamente inexistente<\/b>, mas não dá para descartar que seja acaso.<\/p><div class=\"prose\"><p><b>O que é autocorrelação espacial.<\/b> É a pergunta &quot;o que acontece num lugar se parece com o que acontece ao lado?&quot;. Aqui, cada lugar é um município e &quot;ao lado&quot; são os municípios que fazem divisa com ele. Se a votação do candidato estivesse espalhada ao acaso, saber a % dele numa cidade não diria nada sobre a da cidade vizinha. Quando a autocorrelação é positiva, cidades fortes tendem a ter vizinhas fortes e cidades fracas tendem a ter vizinhas fracas: o voto forma <em>manchas<\/em> no mapa. Isso costuma ter causa concreta, como a região onde o candidato fez campanha, a base de uma liderança local, uma categoria profissional ou um perfil regional de eleitorado.<\/p><p><b>O índice de Moran<\/b> resume isso num número entre −1 e +1. Perto de 0, não há padrão. Positivo, há manchas. Negativo, vizinhos tendem a ser opostos. Ele usa a <em>% de votos válidos<\/em>, e não o total de votos, para que cidade grande não apareça forte só por ter mais gente.<\/p><\/div><div class=\"card\"><div class=\"blk\" data-b=\"4\"><\/div><\/div><p class=\"lead\" style=\"margin-top:16px\">O Moran diz <em>se<\/em> há manchas; o mapa acima (LISA) diz <em>onde<\/em> elas estão. Foram 3 município(s) em núcleo de força, 2 em vazio e 6 em contraste (ilha de voto ou lacuna). Só entra o que é estatisticamente significativo; o resto fica cinza.<\/p><div class=\"expl\"><div><h4><i style=\"background:var(--hh)\"><\/i>Núcleo de força<\/h4><p>Município com % alta, cercado de vizinhos também altos. É a base consolidada: o candidato é conhecido na região inteira, não só numa cidade. O caminho natural de crescimento é puxar os vizinhos que ainda estão abaixo.<\/p><\/div><div><h4><i style=\"background:var(--ou)\"><\/i>Ilha de voto<\/h4><p>Município forte cercado de vizinhos fracos. O voto vem de um motivo local (uma liderança, uma comunidade, um cabo eleitoral) e não transborda para a região. Mostra que há voto ali, mas também que ele pode depender de uma pessoa só.<\/p><\/div><div><h4><i style=\"background:var(--ou);opacity:.45\"><\/i>Lacuna<\/h4><p>Município fraco cercado de vizinhos fortes. Costuma ser a oportunidade mais barata: o candidato já é conhecido ao redor, e a cidade ficou para trás.<\/p><\/div><div><h4><i style=\"background:var(--ll)\"><\/i>Vazio<\/h4><p>Município fraco cercado de vizinhos fracos. Sem voto e sem presença. Quando o candidato tem poucos votos no estado, essa classe domina o mapa e diz pouco; o mais útil é o resto.<\/p><\/div><\/div><h3>Núcleos de força<\/h3><p class=\"lead\" style=\"margin-bottom:10px\">Municípios fortes cercados de vizinhos fortes. É onde a base está consolidada.<\/p><div class=\"blk\" data-b=\"5\"><\/div><h3>Ilhas de voto<\/h3><p class=\"lead\" style=\"margin-bottom:10px\">Municípios fortes em meio a vizinhos fracos. Voto concentrado, que não se espalhou.<\/p><div class=\"blk\" data-b=\"6\"><\/div><h3>Lacunas (oportunidades)<\/h3><p class=\"lead\" style=\"margin-bottom:10px\">Municípios fracos em meio a vizinhos fortes. Tendem a ser os alvos mais baratos de crescimento.<\/p><div class=\"blk\" data-b=\"7\"><\/div><aside class=\"metodo\"><span class=\"lab\">Nota metodológica<\/span><p><b>Moran global<\/b>: correlação entre a % de votos válidos de cada município e a média dessa % entre os vizinhos. Vizinhos = municípios que dividem divisa ou vértice (critério da rainha), com pesos padronizados por linha. A significância é um pseudo-p por 999 permutações, e por isso o menor valor possível é 0,001. <b>LISA<\/b>: decomposição local do Moran; classifica cada município em Alto-Alto, Baixo-Baixo ou contraste (um valor alto entre baixos, ou o inverso), com pseudo-p &lt; 0,05 por permutação condicional. Esse corte vale para cada município isoladamente, sem correção para comparações múltiplas: com centenas de municípios, parte das manchas marcadas pode ser acaso, e a lista deve ser lida como indicação. Cálculo com esda 2.7 e libpysal 4.13.<\/p><span class=\"rl\">Referências<\/span><ul class=\"refs\"><li>Moran, P. A. P. (1950). Notes on continuous stochastic phenomena. <i>Biometrika<\/i>, 37(1/2), 17–23.<\/li><li>Anselin, L. (1995). Local indicators of spatial association—LISA. <i>Geographical Analysis<\/i>, 27(2), 93–115.<\/li><li>Rey, S. J., &amp; Anselin, L. (2007). PySAL: a Python library of spatial analytical methods. <i>The Review of Regional Studies<\/i>, 37(1), 5–27. (Cálculos com os módulos esda e libpysal.)<\/li><\/ul><\/aside><h2 id=\"cidades\"><span class=\"n\">4<\/span>Cidades<\/h2><div class=\"callout\"><b>Leitura com cuidado:<\/b> o TSE não publica voto por bairro. A unidade mínima é a seção eleitoral, que funciona num local de votação. Por isso as cidades são detalhadas por <b>local de votação<\/b>, bairro e zona eleitoral, que são dados oficiais. Eles descrevem onde a pessoa <b>vota<\/b>, que costuma ser perto de onde mora, mas não é a mesma coisa.<\/div><p class=\"lead\">Aparecem as 3 cidades em que o candidato teve <b>mais votos<\/b>, em ordem decrescente (o critério é o volume absoluto de votos, não o percentual). Para escolher outras, use <code>\"cidades\"<\/code> no <code>config.json<\/code>.<\/p><div class=\"tabset\"><div class=\"cscroll\"><button class=\"arr l\" type=\"button\" aria-label=\"Cidades anteriores\" hidden><svg viewBox=\"0 0 24 24\"><path d=\"M15 5l-7 7 7 7\"/><\/svg><\/button><button class=\"arr r\" type=\"button\" aria-label=\"Próximas cidades\" hidden><svg viewBox=\"0 0 24 24\"><path d=\"M9 5l7 7-7 7\"/><\/svg><\/button><div class=\"ctabs\" role=\"tablist\" aria-label=\"Cidades\"><button class=\"ctab\" type=\"button\" role=\"tab\"><b>Cidade 091<\/b><span>1.318 votos · 2,2%<\/span><\/button><button class=\"ctab\" type=\"button\" role=\"tab\"><b>Cidade 041<\/b><span>1.127 votos · 2,0%<\/span><\/button><button class=\"ctab\" type=\"button\" role=\"tab\"><b>Cidade 067<\/b><span>1.057 votos · 2,1%<\/span><\/button><\/div><\/div><section class=\"pane cpanel\"><h3 class=\"cn\">Cidade 091<\/h3><div class=\"mini\"><span><b>1.318<\/b>votos<\/span><span><b>2,20%<\/b>dos votos válidos<\/span><span><b>3<\/b>zona(s) eleitoral(is)<\/span><span><b>102<\/b>locais de votação<\/span><span><b>77.796<\/b>eleitores aptos<\/span><\/div><div class=\"tabset\"><div class=\"tablist\" role=\"tablist\"><button type=\"button\" role=\"tab\">Zonas eleitorais<\/button><button type=\"button\" role=\"tab\">Bairros<\/button><button type=\"button\" role=\"tab\">Locais de votação<\/button><\/div><div class=\"pane\"><div class=\"blk\" data-b=\"8\"><\/div><\/div><div class=\"pane\"><div class=\"blk\" data-b=\"9\"><\/div><\/div><div class=\"pane\"><div class=\"blk\" data-b=\"10\"><\/div><\/div><\/div><\/section><section class=\"pane cpanel\"><h3 class=\"cn\">Cidade 041<\/h3><div class=\"mini\"><span><b>1.127<\/b>votos<\/span><span><b>2,03%<\/b>dos votos válidos<\/span><span><b>3<\/b>zona(s) eleitoral(is)<\/span><span><b>98<\/b>locais de votação<\/span><span><b>72.116<\/b>eleitores aptos<\/span><\/div><div class=\"tabset\"><div class=\"tablist\" role=\"tablist\"><button type=\"button\" role=\"tab\">Zonas eleitorais<\/button><button type=\"button\" role=\"tab\">Bairros<\/button><button type=\"button\" role=\"tab\">Locais de votação<\/button><\/div><div class=\"pane\"><div class=\"blk\" data-b=\"11\"><\/div><\/div><div class=\"pane\"><div class=\"blk\" data-b=\"12\"><\/div><\/div><div class=\"pane\"><div class=\"blk\" data-b=\"13\"><\/div><\/div><\/div><\/section><section class=\"pane cpanel\"><h3 class=\"cn\">Cidade 067<\/h3><div class=\"mini\"><span><b>1.057<\/b>votos<\/span><span><b>2,08%<\/b>dos votos válidos<\/span><span><b>3<\/b>zona(s) eleitoral(is)<\/span><span><b>90<\/b>locais de votação<\/span><span><b>65.751<\/b>eleitores aptos<\/span><\/div><div class=\"tabset\"><div class=\"tablist\" role=\"tablist\"><button type=\"button\" role=\"tab\">Zonas eleitorais<\/button><button type=\"button\" role=\"tab\">Bairros<\/button><button type=\"button\" role=\"tab\">Locais de votação<\/button><\/div><div class=\"pane\"><div class=\"blk\" data-b=\"14\"><\/div><\/div><div class=\"pane\"><div class=\"blk\" data-b=\"15\"><\/div><\/div><div class=\"pane\"><div class=\"blk\" data-b=\"16\"><\/div><\/div><\/div><\/section><\/div><aside class=\"metodo\"><span class=\"lab\">Nota metodológica<\/span><p>Os dados por zona eleitoral vêm da soma dos boletins de urna das seções de cada zona. O TSE não publica voto por bairro, e os nomes dos locais de votação não estão nesta base.<\/p><\/aside><div class=\"parte\"><span>Parte B<\/span><b>Comparação com outros candidatos<\/b><\/div><h2 id=\"comparacao\"><span class=\"n\">5<\/span>Comparação com os mais votados de cada partido<\/h2><p class=\"lead\"><b>Candidato 12005<\/b> teve voto em <b>144 de 144<\/b> municípios, pelo menos 0,5% dos votos válidos em 144, pelo menos 1% em 134 e pelo menos 5% em 0. Entre os 7 candidatos comparados, 1 teve presença de 1% em mais municípios do que ele, e 2 tiveram mais votos no total. A maior abrangência é de Candidato 15002 (MDB), com 135 municípios. O mais votado do PL, Candidato 22003, fez 16.748 votos e chegou a 1% em 134 municípios, o 001 (PSD)<\/span><b class=\"hv\">130<\/b><i class=\"hb\"><u style=\"width:96.3%\"><\/u><\/i><\/li><li class=\"\" data-tip=\"[&quot;Candidato 13005 (PT)&quot;, [[&quot;Votos&quot;, &quot;16.302&quot;], [&quot;% dos válidos no estado&quot;, &quot;1,95%&quot;], [&quot;Municípios com algum voto&quot;, &quot;144 de 144&quot;], [&quot;Municípios com 0,5% ou mais&quot;, &quot;142&quot;], [&quot;Municípios com 1% ou mais&quot;, &quot;128&quot;], [&quot;Municípios com 5% ou mais&quot;, &quot;0&quot;], [&quot;Entre os 3 mais votados em&quot;, &quot;6 municípios&quot;]]]\"><span class=\"hn\">Candidato 13005 (PT)<\/span><b class=\"hv\">128<\/b><i class=\"hb\"><u style=\"width:94.8%\"><\/u><\/i><\/li><li class=\"\" data-tip=\"[&quot;Candidato 45005 (PSDB)&quot;, [[&quot;Votos&quot;, &quot;16.246&quot;], [&quot;% dos válidos no estado&quot;, &quot;1,94%&quot;], [&quot;Municípios com algum voto&quot;, &quot;144 de 144&quot;], [&quot;Municípios com 0,5% ou mais&quot;, &quot;139&quot;], [&quot;Municípios com 1% ou mais&quot;, &quot;127&quot;], [&quot;Municípios com 5% ou mais&quot;, &quot;1&quot;], [&quot;Entre os 3 mais votados em&quot;, &quot;12 municípios&quot;]]]\"><span class=\"hn\">Candidato 45005 (PSDB)<\/span><b class=\"hv\">127<\/b><i class=\"hb\"><u style=\"width:94.1%\"><\/u><\/i><\/li><li class=\"\" data-tip=\"[&quot;Humberto Teste (PCDOB)&quot;, [[&quot;Votos&quot;, &quot;17.477&quot;], [&quot;% dos válidos no estado&quot;, &quot;2,09%&quot;], [&quot;Municípios com algum voto&quot;, &quot;144 de 144&quot;], [&quot;Municípios com 0,5% ou mais&quot;, &quot;126&quot;], [&quot;Municípios com 1% ou mais&quot;, &quot;101&quot;], [&quot;Municípios com 5% ou mais&quot;, &quot;8&quot;], [&quot;Entre os 3 mais votados em&quot;, &quot;40 municípios&quot;]]]\"><span class=\"hn\">Humberto Teste (PCDOB)<\/span><b class=\"hv\">101<\/b><i class=\"hb\"><u style=\"width:74.8%\"><\/u><\/i><\/li><\/ul><\/div><\/div><p style=\"margin:10px 0 0;font-size:12.5px;color:var(--muted)\">O candidato desta análise aparece em dourado. Total de municípios: 144.<\/p><\/div><\/div><\/div><div class=\"blk\" data-b=\"17\"><\/div><div class=\"prose\" style=\"margin-top:14px\"><p><b>Como ler.<\/b> Quase todo candidato recebe algum voto em quase todo município, então contar municípios com pelo menos um voto não distingue ninguém. Por isso o gráfico mostra três réguas: <em>qualquer voto<\/em> (o alcance bruto, que quase todos têm), <em>0,5% ou mais<\/em> e <em>1% ou mais<\/em> dos votos válidos do município (presença relevante, cada vez mais exigente). A tabela traz ainda 5%. As outras colunas ajudam a separar volume de alcance:<\/p><ul><li><b>Entre os 3 mais votados<\/b>: em quantos municípios ele ficou no pódio. Mede força local, não só presença.<\/li><li><b>% dos votos na maior cidade<\/b>: quanto do total vem do município onde mais votou. Alto significa dependência de uma cidade (Porto Alegre, em geral); baixo, votos espalhados.<\/li><li><b>Gini<\/b> e <b>Moran<\/b>: os mesmos das seções 2 e 3, calculados para cada candidato. Gini alto = concentrado; Moran alto = votos formam manchas contínuas no mapa.<\/li><\/ul><p>Cada partido entra com o seu candidato mais votado, mais o candidato desta análise. O partido é a sigla, não a federação (o PCdoB, por exemplo, está na Federação Brasil da Esperança com PT e PV). Candidatos de partidos com chapas enormes e dinheiro de campanha muito diferente não são comparáveis em esforço, só em resultado.<\/p><\/div><aside class=\"metodo\"><span class=\"lab\">Nota metodológica<\/span><p>Para cada partido entra o candidato mais votado do estado no mesmo cargo. As medidas de abrangência contam municípios em que o candidato teve algum voto e aqueles em que teve 0,5%, 1% e 5% ou mais dos votos válidos do município. Gini e número efetivo são os mesmos da seção 2 e o Moran é o da seção 3 (999 permutações para o candidato em foco; 199 para a tabela comparativa, cujo menor p possível é 0,005).<\/p><span class=\"rl\">Referências<\/span><ul class=\"refs\"><li>Gini, C. (1912). <i>Variabilità e mutabilità<\/i>. Bologna: Tipografia di Paolo Cuppini.<\/li><li>Moran, P. A. P. (1950). Notes on continuous stochastic phenomena. <i>Biometrika<\/i>, 37(1/2), 17–23.<\/li><\/ul><\/aside><h2 id=\"sobreposicao\"><span class=\"n\">6<\/span>Sobreposição com outros candidatos<\/h2><p class=\"lead\">A distribuição dos votos de <b>Candidato 12005<\/b> pelos municípios coincide mais com a de <b>Resto do Partido<\/b> (PDT), com 89% de sobreposição, e menos com a de Humberto Teste (PCDOB), com 71%. Como referência, só pelo tamanho do eleitorado de cada município a sobreposição esperada seria de 90%. A relação mais &quot;complementar&quot; é com Humberto Teste (PCDOB), com correlação de -0,16. Nenhum passa da referência por mais de 2 pontos: a sobreposição se explica, em grande parte, só pelo tamanho dos municípios.<\/p><div class=\"prose\"><p>Esta seção responde se Candidato 12005 disputa o mesmo eleitor de outros candidatos ou abriu território próprio. Cada candidato é comparado com ele de três formas:<\/p><ul><li><b>Sobreposição de base<\/b>: distribui os votos de cada candidato pelos municípios (cada município com a sua fatia do total) e soma a parte que coincide. 100% é a mesma distribuição; 0% é nenhum município em comum. Quem ganha votos em Porto Alegre naturalmente se sobrepõe a todos, porque lá há muito eleitor; por isso a referência acima mostra o que o tamanho do eleitorado sozinho produziria. Só vale destacar o que passa dela.<\/li><li><b>Correlação<\/b>: entre as % de votos válidos dos dois, município a município. Positiva, onde um vai bem o outro também; negativa, os dois se complementam e um é forte onde o outro é fraco.<\/li><li><b>Moran bivariado<\/b>: compara a % dele num município com a % do outro nos municípios vizinhos. Positivo, os dois formam manchas nas mesmas regiões. Negativo, onde ele é forte a vizinhança do outro é fraca: territórios diferentes.<\/li><\/ul><p>&quot;Resto da federação&quot; soma os votos dos demais candidatos dos partidos da federação dele.<\/p><\/div><div class=\"card\"><h3>Sobreposição de base (%)<\/h3><div class=\"scroll\"><div class=\"barwrap\"><svg class=\"bars\" viewBox=\"0 0 760 228\" role=\"img\" aria-label=\"Sobreposição\"><g class=\"row\" data-tip=\"[&quot;Resto do Partido (PDT)&quot;, [[&quot;Sobreposição de base&quot;, &quot;89,4%&quot;], [&quot;Correlação&quot;, &quot;0,04&quot;], [&quot;Moran bivariado&quot;, &quot;0,05&quot;], [&quot;Votos&quot;, &quot;95.561&quot;]]]\"><rect class=\"hit\" x=\"0\" y=\"-1.0\" width=\"760\" height=\"32\"/><text class=\"lab\" x=\"168.4\" y=\"19.0\" text-anchor=\"end\">Resto do Partido (PDT)<\/text><path class=\"bar\" d=\"M176.4 4H686.0Q690.0 4 690.0 8V22Q690.0 26 686.0 26H176.4Z\"/><text class=\"val\" x=\"696.0\" y=\"19.0\">89<\/text><\/g><g class=\"row\" data-tip=\"[&quot;Candidato 22003 (PL)&quot;, [[&quot;Sobreposição de base&quot;, &quot;86,2%&quot;], [&quot;Correlação&quot;, &quot;0,10&quot;], [&quot;Moran bivariado&quot;, &quot;-0,01&quot;], [&quot;Votos&quot;, &quot;16.748&quot;]]]\"><rect class=\"hit\" x=\"0\" y=\"31.0\" width=\"760\" height=\"32\"/><text class=\"lab\" x=\"168.4\" y=\"51.0\" text-anchor=\"end\">Candidato 22003 (PL)<\/text><path class=\"bar\" d=\"M176.4 36H667.8568429797289Q671.8568429797289 36 671.8568429797289 40V54Q671.8568429797289 58 667.8568429797289 58H176.4Z\"/><text class=\"val\" x=\"677.8568429797289\" y=\"51.0\">86<\/text><\/g><g class=\"row\" data-tip=\"[&quot;Candidato 15002 (MDB)&quot;, [[&quot;Sobreposição de base&quot;, &quot;85,9%&quot;], [&quot;Correlação&quot;, &quot;0,02&quot;], [&quot;Moran bivariado&quot;, &quot;0,03&quot;], [&quot;Votos&quot;, &quot;17.056&quot;]]]\"><rect class=\"hit\" x=\"0\" y=\"63.0\" width=\"760\" height=\"32\"/><text class=\"lab\" x=\"168.4\" y=\"83.0\" text-anchor=\"end\">Candidato 15002 (MDB)<\/text><path class=\"bar\" d=\"M176.4 68H665.9389780433801Q669.9389780433801 68 669.9389780433801 72V86Q669.9389780433801 90 665.9389780433801 90H176.4Z\"/><text class=\"val\" x=\"675.9389780433801\" y=\"83.0\">86<\/text><\/g><g class=\"row\" data-tip=\"[&quot;Candidato 13005 (PT)&quot;, [[&quot;Sobreposição de base&quot;, &quot;85,2%&quot;], [&quot;Correlação&quot;, &quot;-0,06&quot;], [&quot;Moran bivariado&quot;, &quot;0,02&quot;], [&quot;Votos&quot;, &quot;16.302&quot;]]]\"><rect class=\"hit\" x=\"0\" y=\"95.0\" width=\"760\" height=\"32\"/><text class=\"lab\" x=\"168.4\" y=\"115.0\" text-anchor=\"end\">Candidato 13005 (PT)<\/text><path class=\"bar\" d=\"M176.4 100H661.8849501725447Q665.8849501725447 100 665.8849501725447 104V118Q665.8849501725447 122 661.8849501725447 122H176.4Z\"/><text class=\"val\" x=\"671.8849501725447\" y=\"115.0\">85<\/text><\/g><g class=\"row\" data-tip=\"[&quot;Candidato 55001 (PSD)&quot;, [[&quot;Sobreposição de base&quot;, &quot;84,3%&quot;], [&quot;Correlação&quot;, &quot;-0,05&quot;], [&quot;Moran bivariado&quot;, &quot;0,07&quot;], [&quot;Votos&quot;, &quot;16.688&quot;]]]\"><rect class=\"hit\" x=\"0\" y=\"127.0\" width=\"760\" height=\"32\"/><text class=\"lab\" x=\"168.4\" y=\"147.0\" text-anchor=\"end\">Candidato 55001 (PSD)<\/text><path class=\"bar\" d=\"M176.4 132H656.9307169735287Q660.9307169735287 132 660.9307169735287 136V150Q660.9307169735287 154 656.9307169735287 154H176.4Z\"/><text class=\"val\" x=\"666.9307169735287\" y=\"147.0\">84<\/text><\/g><g class=\"row\" data-tip=\"[&quot;Candidato 45005 (PSDB)&quot;, [[&quot;Sobreposição de base&quot;, &quot;84,1%&quot;], [&quot;Correlação&quot;, &quot;-0,05&quot;], [&quot;Moran bivariado&quot;, &quot;-0,01&quot;], [&quot;Votos&quot;, &quot;16.246&quot;]]]\"><rect class=\"hit\" x=\"0\" y=\"159.0\" width=\"760\" height=\"32\"/><text class=\"lab\" x=\"168.4\" y=\"179.0\" text-anchor=\"end\">Candidato 45005 (PSDB)<\/text><path class=\"bar\" d=\"M176.4 164H655.8160955545374Q659.8160955545374 164 659.8160955545374 168V182Q659.8160955545374 186 655.8160955545374 186H176.4Z\"/><text class=\"val\" x=\"665.8160955545374\" y=\"179.0\">84<\/text><\/g><g class=\"row\" data-tip=\"[&quot;Humberto Teste (PCDOB)&quot;, [[&quot;Sobreposição de base&quot;, &quot;71,2%&quot;], [&quot;Correlação&quot;, &quot;-0,16&quot;], [&quot;Moran bivariado&quot;, &quot;-0,17&quot;], [&quot;Votos&quot;, &quot;17.477&quot;]]]\"><rect class=\"hit\" x=\"0\" y=\"191.0\" width=\"760\" height=\"32\"/><text class=\"lab\" x=\"168.4\" y=\"211.0\" text-anchor=\"end\">Humberto Teste (PCDOB)<\/text><path class=\"bar\" d=\"M176.4 196H581.2704870085875Q585.2704870085875 196 585.2704870085875 200V214Q585.2704870085875 218 581.2704870085875 218H176.4Z\"/><text class=\"val\" x=\"591.2704870085875\" y=\"211.0\">71<\/text><\/g><\/svg><ul class=\"hbars\" aria-label=\"Sobreposição\"><li class=\"\" data-tip=\"[&quot;Resto do Partido (PDT)&quot;, [[&quot;Sobreposição de base&quot;, &quot;89,4%&quot;], [&quot;Correlação&quot;, &quot;0,04&quot;], [&quot;Moran bivariado&quot;, &quot;0,05&quot;], [&quot;Votos&quot;, &quot;95.561&quot;]]]\"><span class=\"hn\">Resto do Partido (PDT)<\/span><b class=\"hv\">89<\/b><i class=\"hb\"><u style=\"width:100.0%\"><\/u><\/i><\/li><li class=\"\" data-tip=\"[&quot;Candidato 22003 (PL)&quot;, [[&quot;Sobreposição de base&quot;, &quot;86,2%&quot;], [&quot;Correlação&quot;, &quot;0,10&quot;], [&quot;Moran bivariado&quot;, &quot;-0,01&quot;], [&quot;Votos&quot;, &quot;16.748&quot;]]]\"><span class=\"hn\">Candidato 22003 (PL)<\/span><b class=\"hv\">86<\/b><i class=\"hb\"><u style=\"width:96.5%\"><\/u><\/i><\/li><li class=\"\" data-tip=\"[&quot;Candidato 15002 (MDB)&quot;, [[&quot;Sobreposição de base&quot;, &quot;85,9%&quot;], [&quot;Correlação&quot;, &quot;0,02&quot;], [&quot;Moran bivariado&quot;, &quot;0,03&quot;], [&quot;Votos&quot;, &quot;17.056&quot;]]]\"><span class=\"hn\">Candidato 15002 (MDB)<\/span><b class=\"hv\">86<\/b><i class=\"hb\"><u style=\"width:96.1%\"><\/u><\/i><\/li><li class=\"\" data-tip=\"[&quot;Candidato 13005 (PT)&quot;, [[&quot;Sobreposição de base&quot;, &quot;85,2%&quot;], [&quot;Correlação&quot;, &quot;-0,06&quot;], [&quot;Moran bivariado&quot;, &quot;0,02&quot;], [&quot;Votos&quot;, &quot;16.302&quot;]]]\"><span class=\"hn\">Candidato 13005 (PT)<\/span><b class=\"hv\">85<\/b><i class=\"hb\"><u style=\"width:95.3%\"><\/u><\/i><\/li><li class=\"\" data-tip=\"[&quot;Candidato 55001 (PSD)&quot;, [[&quot;Sobreposição de base&quot;, &quot;84,3%&quot;], [&quot;Correlação&quot;, &quot;-0,05&quot;], [&quot;Moran bivariado&quot;, &quot;0,07&quot;], [&quot;Votos&quot;, &quot;16.688&quot;]]]\"><span class=\"hn\">Candidato 55001 (PSD)<\/span><b class=\"hv\">84<\/b><i class=\"hb\"><u style=\"width:94.3%\"><\/u><\/i><\/li><li class=\"\" data-tip=\"[&quot;Candidato 45005 (PSDB)&quot;, [[&quot;Sobreposição de base&quot;, &quot;84,1%&quot;], [&quot;Correlação&quot;, &quot;-0,05&quot;], [&quot;Moran bivariado&quot;, &quot;-0,01&quot;], [&quot;Votos&quot;, &quot;16.246&quot;]]]\"><span class=\"hn\">Candidato 45005 (PSDB)<\/span><b class=\"hv\">84<\/b><i class=\"hb\"><u style=\"width:94.1%\"><\/u><\/i><\/li><li class=\"\" data-tip=\"[&quot;Humberto Teste (PCDOB)&quot;, [[&quot;Sobreposição de base&quot;, &quot;71,2%&quot;], [&quot;Correlação&quot;, &quot;-0,16&quot;], [&quot;Moran bivariado&quot;, &quot;-0,17&quot;], [&quot;Votos&quot;, &quot;17.477&quot;]]]\"><span class=\"hn\">Humberto Teste (PCDOB)<\/span><b class=\"hv\">71<\/b><i class=\"hb\"><u style=\"width:79.6%\"><\/u><\/i><\/li><\/ul><\/div><\/div><p style=\"margin:10px 0 0;font-size:12.5px;color:var(--muted)\">Referência pelo tamanho do eleitorado: 90%.<\/p><\/div><div class=\"blk\" data-b=\"18\"><\/div><aside class=\"metodo\"><span class=\"lab\">Nota metodológica<\/span><p><b>Sobreposição<\/b> = Σ min(sᵢ, tᵢ), em que s e t são as frações dos votos de cada candidato em cada município. Vale 100% quando as distribuições coincidem e 0 quando não têm município em comum; é o complemento do índice de dissimilaridade de Duncan e Duncan (100% − D). <b>Correlação<\/b>: Pearson entre as % de votos válidos dos dois candidatos nos municípios (não ponderada). <b>Moran bivariado<\/b>: associação entre a % do candidato em foco em cada município e a média da % do outro nos vizinhos (Σ zx·W zy ÷ n, com os pesos da seção 3), segundo a lógica de correlação espacial multivariada de Wartenberg; pseudo-p por 199 permutações. Só entram candidatos com ao menos 1.000 votos.<\/p><span class=\"rl\">Referências<\/span><ul class=\"refs\"><li>Duncan, O. D., &amp; Duncan, B. (1955). A methodological analysis of segregation indexes. <i>American Sociological Review<\/i>, 20(2), 210–217.<\/li><li>Wartenberg, D. (1985). Multivariate spatial correlation: a method for exploratory geographical analysis. <i>Geographical Analysis<\/i>, 17(4), 263–283.<\/li><li>Rey, S. J., &amp; Anselin, L. (2007). PySAL: a Python library of spatial analytical methods. <i>The Review of Regional Studies<\/i>, 37(1), 5–27. (Cálculos com os módulos esda e libpysal.)<\/li><\/ul><\/aside><h2 id=\"federacao\"><span class=\"n\">7<\/span>Participação na federação<\/h2><p class=\"lead\">A federação PDT teve 112.399 votos nominais no estado (13,4% dos votos válidos). <b>Candidato 12005<\/b> ficou com <b>15,0%<\/b> deles. Em 79 municípios ele recebeu menos do que essa participação média indicaria e em 62 recebeu mais.<\/p><div class=\"prose\"><p>Candidato 12005 divide o eleitor da federação com os colegas de chapa. A pergunta aqui é: dado quanto a federação votou em cada município, ele ficou com mais ou menos do que a sua participação média? <b>Participação<\/b> é a parcela dos votos da federação que foi para ele. <b>Esperado<\/b> é o que ele teria se tivesse a participação média do estado (15,0%) em cada município. <b>Diferença<\/b> é esperado menos o que teve: positiva quando ele ficou abaixo.<\/p><p>Soma da diferença nos municípios em que ele ficou abaixo: <b>1.519 votos<\/b>. Não é uma projeção: esses votos sairiam de colegas de federação, não de adversários. Serve para apontar onde o eleitor do campo existe e a campanha dele não chegou.<\/p><\/div><div class=\"card\"><div class=\"blk\" data-b=\"19\"><\/div><\/div><h3>Onde ele ficou mais abaixo do esperado pela federação<\/h3><div class=\"blk\" data-b=\"20\"><\/div><aside class=\"metodo\"><span class=\"lab\">Nota metodológica<\/span><p>Participação = votos nominais do candidato ÷ votos nominais de todos os candidatos dos partidos da federação no município (votos de legenda não entram). O <b>esperado<\/b> é o total da federação no município vezes a participação média do candidato no estado; a soma dos esperados é igual à soma dos votos observados. A lógica é a do componente diferencial da análise shift-share (Dunn, 1960), usada por analogia: compara o desempenho local com o que ocorreria se o candidato tivesse a mesma participação em todo lugar. A composição da federação é a registrada no TSE em 05/10/2026.<\/p><span class=\"rl\">Referências<\/span><ul class=\"refs\"><li>Dunn, E. S. (1960). A statistical and analytical technique for regional analysis. <i>Papers of the Regional Science Association<\/i>, 6(1), 97–112.<\/li><\/ul><\/aside><div class=\"parte\"><span>Parte C<\/span><b>Modelagem e prioridades<\/b><\/div><h2 id=\"modelo\"><span class=\"n\">8<\/span>Modelo: acima e abaixo do esperado<\/h2><p class=\"lead\">Um modelo simples explica 2% da variação (R² ponderado pelo tamanho dos municípios) da % de votos válidos do Candidato 12005 entre os 144 municípios. Os resíduos mostram onde ele vota bem acima ou abaixo do que o modelo prevê: 6 municípios acima e 0 abaixo. Sobre os resíduos, os resíduos não formam manchas, então o modelo capturou o essencial da geografia.<\/p><div class=\"prose\"><p><b>O que o modelo faz.<\/b> Prevê a % de votos válidos dele em cada município a partir de quatro coisas que não dependem da campanha dele: o tamanho do eleitorado, a abstenção, a votação do resto da federação no município e a votação do resto da federação nos vizinhos. Municípios maiores pesam mais na estimativa (ponderação pelos votos válidos). A diferença entre o que ele teve e o que o modelo previu é o <b>resíduo<\/b>: positivo, ele foi melhor do que o contexto indica; negativo, pior.<\/p><p><b>Como usar.<\/b> Resíduo muito positivo sugere liderança local, campanha forte ou voto de nicho: vale entender e replicar. Resíduo muito negativo, em município onde a federação vai bem, é o lugar onde mais falta: o contexto favorece e o voto não veio. É um retrato do que aconteceu, não uma explicação causal. Variáveis que não entraram (renda, escolaridade, religião, visitas de campanha) ficam nos resíduos.<\/p><\/div><div class=\"callout\">Nenhuma das variáveis tem efeito estatisticamente significativo isolado.<\/div><div class=\"callout\">A votação do resto da federação, no município e nos vizinhos, não acrescenta poder de explicação depois de considerado o tamanho do município. Ou seja, o voto dele não acompanha a força da federação: ele vai bem e mal em lugares diferentes dos colegas de chapa.<\/div><div style=\"margin-bottom:16px\"><div class=\"blk\" data-b=\"21\"><\/div><\/div><div class=\"card\"><div class=\"blk\" data-b=\"22\"><\/div><\/div><h3>Onde foi mais acima do esperado (em votos)<\/h3><div class=\"blk\" data-b=\"23\"><\/div><h3>Onde ficou mais abaixo do esperado (em votos)<\/h3><div class=\"blk\" data-b=\"24\"><\/div><aside class=\"metodo\"><span class=\"lab\">Nota metodológica<\/span><p>Regressão por mínimos quadrados ponderados (peso = votos válidos do município) da % de votos válidos do candidato sobre o logaritmo do eleitorado, a abstenção, a % do resto da federação no município e a % do resto da federação nos vizinhos (defasagem espacial das covariáveis, o modelo SLX). Os erros-padrão e os valores de p são robustos a heterocedasticidade (HC1), porque a dispersão dos resíduos cresce com o porte do município. O R² é ponderado. O <b>resíduo padronizado<\/b> divide o resíduo (em pontos percentuais) da dispersão típica de municípios do mesmo porte, estimada por variância multiplicativa; |z| &gt; 2 é destacado. O Moran dos resíduos padronizados (199 permutações) testa se sobrou padrão espacial. O modelo descreve associações; não identifica causas.<\/p><span class=\"rl\">Referências<\/span><ul class=\"refs\"><li>Anselin, L. (1988). <i>Spatial Econometrics: methods and models<\/i>. Dordrecht: Kluwer Academic.<\/li><li>Halleck Vega, S., &amp; Elhorst, J. P. (2015). The SLX model. <i>Journal of Regional Science<\/i>, 55(3), 339–363.<\/li><li>White, H. (1980). A heteroskedasticity-consistent covariance matrix estimator and a direct test for heteroskedasticity. <i>Econometrica<\/i>, 48(4), 817–838.<\/li><li>MacKinnon, J. G., &amp; White, H. (1985). Some heteroskedasticity-consistent covariance matrix estimators with improved finite sample properties. <i>Journal of Econometrics<\/i>, 29(3), 305–325.<\/li><li>Harvey, A. C. (1976). Estimating regression models with multiplicative heteroscedasticity. <i>Econometrica<\/i>, 44(3), 461–465.<\/li><li>Moran, P. A. P. (1950). Notes on continuous stochastic phenomena. <i>Biometrika<\/i>, 37(1/2), 17–23.<\/li><\/ul><\/aside><h2 id=\"distancia\"><span class=\"n\">9<\/span>Distância dos redutos<\/h2><p class=\"lead\">44% dos votos dele vêm de municípios a até 100 km do reduto mais próximo e 68% a até 200 km. Fora dos redutos, a % de votos válidos quase não muda com a distância (correlação de Spearman 0,09, descritiva).<\/p><div class=\"prose\"><p><b>Como foi calculado.<\/b> Os redutos são os 5 municípios onde ele mais votou: Cidade 091, Cidade 041, Cidade 067, Cidade 042, Cidade 121. Para cada município mede-se a distância em linha reta, entre os centros dos municípios, até o reduto mais próximo. Os municípios são agrupados em faixas de distância e, em cada faixa, calcula-se a % de votos válidos que ele teve (votos dele ÷ votos válidos de todos os municípios da faixa).<\/p><p><b>Como ler.<\/b> Se a % cai de forma regular com a distância, o voto &quot;irradia&quot; dos redutos e a campanha pode crescer pelas bordas. Se ela se mantém ou aparece em manchas longe dos redutos, o voto vem de redes próprias (lideranças, categorias) que não dependem da proximidade e exigem outra estratégia. A distância em linha reta não considera estradas nem a rede urbana.<\/p><\/div><div class=\"card\"><h3>% dos votos válidos por distância do reduto mais próximo<\/h3><div class=\"scroll\"><div class=\"barwrap\"><svg class=\"bars\" viewBox=\"0 0 760 196\" role=\"img\" aria-label=\"Votação por faixa de distância\"><g class=\"row\" data-tip=\"[&quot;Reduto&quot;, [[&quot;Municípios&quot;, &quot;5&quot;], [&quot;Votos dele&quot;, &quot;5.277&quot;], [&quot;% dos votos dele&quot;, &quot;31,3%&quot;], [&quot;% dos votos válidos&quot;, &quot;2,07%&quot;]]]\"><rect class=\"hit\" x=\"0\" y=\"-1.0\" width=\"760\" height=\"32\"/><text class=\"lab\" x=\"110.8\" y=\"19.0\" text-anchor=\"end\">Reduto<\/text><path class=\"bar\" d=\"M118.8 4H673.4169363053792Q677.4169363053792 4 677.4169363053792 8V22Q677.4169363053792 26 673.4169363053792 26H118.8Z\"/><text class=\"val\" x=\"683.4169363053792\" y=\"19.0\">2,07%<\/text><\/g><g class=\"row\" data-tip=\"[&quot;50 a 100 km&quot;, [[&quot;Municípios&quot;, &quot;26&quot;], [&quot;Votos dele&quot;, &quot;2.196&quot;], [&quot;% dos votos dele&quot;, &quot;13,0%&quot;], [&quot;% dos votos válidos&quot;, &quot;2,00%&quot;]]]\"><rect class=\"hit\" x=\"0\" y=\"31.0\" width=\"760\" height=\"32\"/><text class=\"lab\" x=\"110.8\" y=\"51.0\" text-anchor=\"end\">50 a 100 km<\/text><path class=\"bar\" d=\"M118.8 36H656.5825913873218Q660.5825913873218 36 660.5825913873218 40V54Q660.5825913873218 58 656.5825913873218 58H118.8Z\"/><text class=\"val\" x=\"666.5825913873218\" y=\"51.0\">2,00%<\/text><\/g><g class=\"row\" data-tip=\"[&quot;100 a 150 km&quot;, [[&quot;Municípios&quot;, &quot;27&quot;], [&quot;Votos dele&quot;, &quot;1.858&quot;], [&quot;% dos votos dele&quot;, &quot;11,0%&quot;], [&quot;% dos votos válidos&quot;, &quot;1,73%&quot;]]]\"><rect class=\"hit\" x=\"0\" y=\"63.0\" width=\"760\" height=\"32\"/><text class=\"lab\" x=\"110.8\" y=\"83.0\" text-anchor=\"end\">100 a 150 km<\/text><path class=\"bar\" d=\"M118.8 68H581.838379439052Q585.838379439052 68 585.838379439052 72V86Q585.838379439052 90 581.838379439052 90H118.8Z\"/><text class=\"val\" x=\"591.838379439052\" y=\"83.0\">1,73%<\/text><\/g><g class=\"row\" data-tip=\"[&quot;150 a 200 km&quot;, [[&quot;Municípios&quot;, &quot;25&quot;], [&quot;Votos dele&quot;, &quot;2.068&quot;], [&quot;% dos votos dele&quot;, &quot;12,3%&quot;], [&quot;% dos votos válidos&quot;, &quot;2,00%&quot;]]]\"><rect class=\"hit\" x=\"0\" y=\"95.0\" width=\"760\" height=\"32\"/><text class=\"lab\" x=\"110.8\" y=\"115.0\" text-anchor=\"end\">150 a 200 km<\/text><path class=\"bar\" d=\"M118.8 100H656.0730488049225Q660.0730488049225 100 660.0730488049225 104V118Q660.0730488049225 122 656.0730488049225 122H118.8Z\"/><text class=\"val\" x=\"666.0730488049225\" y=\"115.0\">2,00%<\/text><\/g><g class=\"row\" data-tip=\"[&quot;200 a 300 km&quot;, [[&quot;Municípios&quot;, &quot;41&quot;], [&quot;Votos dele&quot;, &quot;3.666&quot;], [&quot;% dos votos dele&quot;, &quot;21,8%&quot;], [&quot;% dos votos válidos&quot;, &quot;2,11%&quot;]]]\"><rect class=\"hit\" x=\"0\" y=\"127.0\" width=\"760\" height=\"32\"/><text class=\"lab\" x=\"110.8\" y=\"147.0\" text-anchor=\"end\">200 a 300 km<\/text><path class=\"bar\" d=\"M118.8 132H686.0Q690.0 132 690.0 136V150Q690.0 154 686.0 154H118.8Z\"/><text class=\"val\" x=\"696.0\" y=\"147.0\">2,11%<\/text><\/g><g class=\"row\" data-tip=\"[&quot;mais de 300 km&quot;, [[&quot;Municípios&quot;, &quot;20&quot;], [&quot;Votos dele&quot;, &quot;1.773&quot;], [&quot;% dos votos dele&quot;, &quot;10,5%&quot;], [&quot;% dos votos válidos&quot;, &quot;2,01%&quot;]]]\"><rect class=\"hit\" x=\"0\" y=\"159.0\" width=\"760\" height=\"32\"/><text class=\"lab\" x=\"110.8\" y=\"179.0\" text-anchor=\"end\">mais de 300 km<\/text><path class=\"bar\" d=\"M118.8 164H658.8017264261252Q662.8017264261252 164 662.8017264261252 168V182Q662.8017264261252 186 658.8017264261252 186H118.8Z\"/><text class=\"val\" x=\"668.8017264261252\" y=\"179.0\">2,01%<\/text><\/g><\/svg><ul class=\"hbars\" aria-label=\"Votação por faixa de distância\"><li class=\"\" data-tip=\"[&quot;Reduto&quot;, [[&quot;Municípios&quot;, &quot;5&quot;], [&quot;Votos dele&quot;, &quot;5.277&quot;], [&quot;% dos votos dele&quot;, &quot;31,3%&quot;], [&quot;% dos votos válidos&quot;, &quot;2,07%&quot;]]]\"><span class=\"hn\">Reduto<\/span><b class=\"hv\">2,07%<\/b><i class=\"hb\"><u style=\"width:97.8%\"><\/u><\/i><\/li><li class=\"\" data-tip=\"[&quot;50 a 100 km&quot;, [[&quot;Municípios&quot;, &quot;26&quot;], [&quot;Votos dele&quot;, &quot;2.196&quot;], [&quot;% dos votos dele&quot;, &quot;13,0%&quot;], [&quot;% dos votos válidos&quot;, &quot;2,00%&quot;]]]\"><span class=\"hn\">50 a 100 km<\/span><b class=\"hv\">2,00%<\/b><i class=\"hb\"><u style=\"width:94.8%\"><\/u><\/i><\/li><li class=\"\" data-tip=\"[&quot;100 a 150 km&quot;, [[&quot;Municípios&quot;, &quot;27&quot;], [&quot;Votos dele&quot;, &quot;1.858&quot;], [&quot;% dos votos dele&quot;, &quot;11,0%&quot;], [&quot;% dos votos válidos&quot;, &quot;1,73%&quot;]]]\"><span class=\"hn\">100 a 150 km<\/span><b class=\"hv\">1,73%<\/b><i class=\"hb\"><u style=\"width:81.8%\"><\/u><\/i><\/li><li class=\"\" data-tip=\"[&quot;150 a 200 km&quot;, [[&quot;Municípios&quot;, &quot;25&quot;], [&quot;Votos dele&quot;, &quot;2.068&quot;], [&quot;% dos votos dele&quot;, &quot;12,3%&quot;], [&quot;% dos votos válidos&quot;, &quot;2,00%&quot;]]]\"><span class=\"hn\">150 a 200 km<\/span><b class=\"hv\">2,00%<\/b><i class=\"hb\"><u style=\"width:94.8%\"><\/u><\/i><\/li><li class=\"\" data-tip=\"[&quot;200 a 300 km&quot;, [[&quot;Municípios&quot;, &quot;41&quot;], [&quot;Votos dele&quot;, &quot;3.666&quot;], [&quot;% dos votos dele&quot;, &quot;21,8%&quot;], [&quot;% dos votos válidos&quot;, &quot;2,11%&quot;]]]\"><span class=\"hn\">200 a 300 km<\/span><b class=\"hv\">2,11%<\/b><i class=\"hb\"><u style=\"width:100.0%\"><\/u><\/i><\/li><li class=\"\" data-tip=\"[&quot;mais de 300 km&quot;, [[&quot;Municípios&quot;, &quot;20&quot;], [&quot;Votos dele&quot;, &quot;1.773&quot;], [&quot;% dos votos dele&quot;, &quot;10,5%&quot;], [&quot;% dos votos válidos&quot;, &quot;2,01%&quot;]]]\"><span class=\"hn\">mais de 300 km<\/span><b class=\"hv\">2,01%<\/b><i class=\"hb\"><u style=\"width:95.2%\"><\/u><\/i><\/li><\/ul><\/div><\/div><\/div><div class=\"blk\" data-b=\"25\"><\/div><div class=\"card\"><div class=\"blk\" data-b=\"26\"><\/div><\/div><aside class=\"metodo\"><span class=\"lab\">Nota metodológica<\/span><p>Distância em linha reta entre centroides dos municípios, calculada em projeção UTM (a diferença para a distância geodésica é de no máximo 0,3% neste estado), até o mais próximo dos 5 municípios mais votados do candidato. A associação entre distância e % de votos válidos é a correlação de Spearman (postos), calculada sem os redutos e incluindo municípios sem voto; é descritiva, porque municípios vizinhos não são observações independentes e o valor de p convencional seria otimista. Que a votação decaia com a distância é a ideia da primeira lei da geografia, de Tobler.<\/p><span class=\"rl\">Referências<\/span><ul class=\"refs\"><li>Tobler, W. R. (1970). A computer movie simulating urban growth in the Detroit region. <i>Economic Geography<\/i>, 46(sup1), 234–240.<\/li><li>Spearman, C. (1904). The proof and measurement of association between two things. <i>The American Journal of Psychology<\/i>, 15(1), 72–101.<\/li><\/ul><\/aside><h2 id=\"potencial\"><span class=\"n\">10<\/span>Eficiência e potencial<\/h2><p class=\"lead\">Duas medidas para responder onde vale concentrar esforço: uma diz o quanto o candidato já converte do eleitorado de cada município, a outra diz quantos votos ainda há para buscar.<\/p><div class=\"prose\"><ul><li><b>Eficiência: votos por 100 eleitores aptos.<\/b> De cada 100 pessoas que podem votar no município, quantas votaram no candidato. Compara cidades de tamanhos diferentes na mesma régua e mostra onde ele converte melhor o eleitorado.<\/li><li><b>Potencial: votos até a média.<\/b> Se o município votasse nele na mesma proporção do estado inteiro, quantos votos a mais ele teria. A conta é: <em>% dele no estado × votos válidos do município − votos que ele teve<\/em>. Se der negativo (o município já está acima da média), vale zero.<\/li><\/ul><\/div><div class=\"exemplo\"><b>Exemplo com os números dele.<\/b> Cidade 117 teve 8.163 votos válidos. Na média do estado (2,01%), Candidato 12005 receberia cerca de 164 votos ali. Teve 108 (1,32%). A diferença, <b>56 votos<\/b>, é o potencial do município.<\/div><div class=\"callout\"><b>Como usar:<\/b> não é uma projeção nem uma promessa de que dá para chegar à média. Cidades grandes sobem para o topo simplesmente porque têm muito eleitor, então a lista mostra onde a diferença em votos é maior, não onde é mais fácil. Para achar a oportunidade realista, cruze com a seção 3: um município de potencial alto que é uma <em>lacuna<\/em> (fraco entre vizinhos fortes) tende a custar menos do que um município fraco cercado de municípios fracos.<\/div><div class=\"blk\" data-b=\"27\"><\/div><aside class=\"metodo\"><span class=\"lab\">Nota metodológica<\/span><p><b>Votos por 100 aptos<\/b> = votos ÷ eleitores aptos × 100. <b>Votos até a média<\/b> = quanto faltaria para o município atingir a % de votos válidos que o candidato tem no estado (zero quando ele já a atinge). É uma medida de oportunidade, não uma previsão.<\/p><\/aside><div class=\"parte\"><span>Parte D<\/span><b>Contexto e método<\/b><\/div><h2 id=\"contexto\"><span class=\"n\">11<\/span>Contexto: partido, abstenção, brancos e nulos<\/h2><h3>Candidatos do mesmo partido<\/h3><div class=\"blk\" data-b=\"28\"><\/div><h3>Municípios com maior abstenção<\/h3><div class=\"blk\" data-b=\"29\"><\/div><h3>Por região<\/h3><div class=\"blk\" data-b=\"30\"><\/div><aside class=\"metodo\"><span class=\"lab\">Nota metodológica<\/span><p>Abstenção = 1 − (votos de todos os candidatos, brancos e nulos ÷ eleitores aptos). É uma aproximação: o numerador vem dos boletins de urna e o denominador, do cadastro de aptos por seção.<\/p><\/aside><h2 id=\"metodo\"><span class=\"n\">M<\/span>Notas metodológicas<\/h2><h3>Fontes de dados<\/h3><div class=\"prose\"><p>Votação por seção (boletins de urna), perfil do eleitorado e eleitorado por local de votação, do Portal de Dados Abertos do TSE, e malha municipal do IBGE.<\/p><\/div><h3>Definições<\/h3><div class=\"prose\"><ul><li><b>% de votos válidos<\/b>: votos do candidato ÷ (votos nominais + de legenda), sem brancos e nulos.<\/li><li><b>Moran e LISA<\/b>: vizinhança por divisa, 999 permutações, p &lt; 0,05. O Gini é calculado sobre todos os municípios do estado, incluindo os sem voto.<\/li><li><b>Abstenção<\/b>: 1 − (votos de todos os candidatos, brancos e nulos ÷ eleitores aptos). É uma aproximação.<\/li><\/ul><\/div><h3>Referências consolidadas<\/h3><div class=\"metodo\" style=\"margin-top:0\"><ul class=\"refs\"><li>Anselin, L. (1988). <i>Spatial Econometrics: methods and models<\/i>. Dordrecht: Kluwer Academic.<\/li><li>Anselin, L. (1995). Local indicators of spatial association—LISA. <i>Geographical Analysis<\/i>, 27(2), 93–115.<\/li><li>Duncan, O. D., &amp; Duncan, B. (1955). A methodological analysis of segregation indexes. <i>American Sociological Review<\/i>, 20(2), 210–217.<\/li><li>Dunn, E. S. (1960). A statistical and analytical technique for regional analysis. <i>Papers of the Regional Science Association<\/i>, 6(1), 97–112.<\/li><li>Gini, C. (1912). <i>Variabilità e mutabilità<\/i>. Bologna: Tipografia di Paolo Cuppini.<\/li><li>Halleck Vega, S., &amp; Elhorst, J. P. (2015). The SLX model. <i>Journal of Regional Science<\/i>, 55(3), 339–363.<\/li><li>Harvey, A. C. (1976). Estimating regression models with multiplicative heteroscedasticity. <i>Econometrica<\/i>, 44(3), 461–465.<\/li><li>Isard, W. (1960). <i>Methods of Regional Analysis: an introduction to regional science<\/i>. Cambridge, MA: Technology Press of MIT; New York: John Wiley &amp; Sons.<\/li><li>Laakso, M., &amp; Taagepera, R. (1979). “Effective” number of parties: a measure with application to West Europe. <i>Comparative Political Studies<\/i>, 12(1), 3–27.<\/li><li>MacKinnon, J. G., &amp; White, H. (1985). Some heteroskedasticity-consistent covariance matrix estimators with improved finite sample properties. <i>Journal of Econometrics<\/i>, 29(3), 305–325.<\/li><li>Moran, P. A. P. (1950). Notes on continuous stochastic phenomena. <i>Biometrika<\/i>, 37(1/2), 17–23.<\/li><li>Rey, S. J., &amp; Anselin, L. (2007). PySAL: a Python library of spatial analytical methods. <i>The Review of Regional Studies<\/i>, 37(1), 5–27. (Cálculos com os módulos esda e libpysal.)<\/li><li>Spearman, C. (1904). The proof and measurement of association between two things. <i>The American Journal of Psychology<\/i>, 15(1), 72–101.<\/li><li>Tobler, W. R. (1970). A computer movie simulating urban growth in the Detroit region. <i>Economic Geography<\/i>, 46(sup1), 234–240.<\/li><li>Wartenberg, D. (1985). Multivariate spatial correlation: a method for exploratory geographical analysis. <i>Geographical Analysis<\/i>, 17(4), 263–283.<\/li><li>White, H. (1980). A heteroskedasticity-consistent covariance matrix estimator and a direct test for heteroskedasticity. <i>Econometrica<\/i>, 48(4), 817–838.<\/li><\/ul><\/div>","b":[{"t":"map","id":"mapa-estado","vb":"0 0 760 716","aria":"Mapa de votos por município","m":[{"key":"votos","label":"Votos","note":"Quantidade de votos que o candidato teve em cada município. Mostra onde está o volume.","legend":[["s1","11 – 27"],["s2","27 – 54"],["s3","54 – 74"],["s4","74 – 108"],["s5","108 – 146"],["s6","146 – 1.318"]]},{"key":"pct","label":"% dos válidos","note":"Percentual dos votos válidos do município que foram para o candidato. Mostra a força proporcional, sem favorecer cidade grande.","legend":[["s1", function busca(){
 const inp=document.getElementById('msq'),list=document.getElementById('msl');if(!inp||!list||!D||!D.mun)return;
 let items=[],act=-1;
 const hide=()=>{list.hidden=true;inp.setAttribute('aria-expanded','false');act=-1};
 function paint(){[...list.children].forEach((li,i)=>li.setAttribute('aria-selected',i===act))}
 function pick(i){const it=items[i];if(!it)return;hide();inp.value=it.n;lastFocus=inp;abrir(it.cd);
  const c=document.getElementById('mapa-estado');if(c){const r=c.getBoundingClientRect();if(r.top<0||r.bottom>innerHeight)c.scrollIntoView({block:'center',behavior:'smooth'})}}
 function upd(){const q=norm(inp.value.trim());list.replaceChildren();if(!q){hide();return}
  const a=names.filter(n=>n.k.startsWith(q)),b=names.filter(n=>!n.k.startsWith(q)&&n.k.includes(q));items=a.concat(b).slice(0,8);
  if(!items.length)list.appendChild(mk('li','vazio','Nenhum município com esse nome'));
  items.forEach((it,i)=>{const li=mk('li',null,it.n);li.setAttribute('role','option');li.addEventListener('pointerdown',ev=>{ev.preventDefault();pick(i)});list.appendChild(li)});
  act=items.length?0:-1;paint();list.hidden=false;inp.setAttribute('aria-expanded','true')}
 inp.addEventListener('input',upd);inp.addEventListener('focus',()=>{if(inp.value)upd()});inp.addEventListener('blur',()=>setTimeout(hide,120));
 inp.addEventListener('keydown',e=>{if(list.hidden&&e.key==='ArrowDown'){upd();return}
  if(e.key==='ArrowDown'){e.preventDefault();act=Math.min(items.length-1,act+1);paint()}
  else if(e.key==='ArrowUp'){e.preventDefault();act=Math.max(0,act-1);paint()}
  else if(e.key==='Enter'){e.preventDefault();if(act>=0)pick(act)}
  else if(e.key==='Escape'){if(!list.hidden){e.stopPropagation();hide()}}})}

  while(ordem.length>8)delete cacheP[ordem.shift()];return P})}
function geo(nome){if(!nome)return Promise.resolve('');if(cacheG[nome])return Promise.resolve(cacheG[nome]);
